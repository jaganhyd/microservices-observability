name: jbmicroservice

services:
  redis:
    image: redis
    container_name: redis-ms
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 400m
        reservations:
          memory: 128m
    networks:
      - jaganMs

  grafana-lgtm:
    image: grafana/otel-lgtm
    container_name: grafana-lgtm-ms
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - grafana-lgtm-data:/data
    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 512m
    networks:
      - jaganMs

  configserver:
    image: "jagan619/configserver_1:v1"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    healthcheck:
      #test: ["CMD-SHELL", "curl --fail --silent http://localhost:8071/actuator/health/readiness | grep UP || exit 1"]
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8071 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3" ]
      #test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "configserver-1"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      #OTEL_SERVICE_NAME: "configserver-1"
      #OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-lgtm-ms:4318"
      #OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
    networks:
      - jaganMs

  eurekaserver:
    image: "jagan619/eurekaserver:v1"
    container_name: eurekaserver-ms
    hostname: eurekaserver
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl --fail --silent http://localhost:8070/actuator/health/readiness | grep UP || exit 1"]
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8070 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      SPRING_PROFILES_ACTIVE: default
      #AVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      #OTEL_SERVICE_NAME: "eurekaserver"
      #OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-lgtm-ms:4318"
      #OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
    networks:
      - jaganMs

  accounts:
    image: "jagan619/accounts_1:v1"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    healthcheck:
      #test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness | grep UP || exit 1"]
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts-1"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      SPRING_PROFILES_ACTIVE: default
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      #OTEL_SERVICE_NAME: "accounts-1"
      #OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-lgtm-ms:4318"
      #OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
    deploy:
      resources:
        limits:
          memory: 400m
    networks:
      - jaganMs

  loans:
    image: "jagan619/loans_1:v1"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl --fail --silent http://localhost:8090/actuator/health/readiness | grep UP || exit 1"]
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "loans-1"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      SPRING_PROFILES_ACTIVE: default
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      #OTEL_SERVICE_NAME: "loans-1"
      #OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-lgtm-ms:4318"
      #OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
    networks:
      - jaganMs

  cards:
    image: "jagan619/cards_1:v1"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/actuator/health/readiness | grep UP || exit 1"]
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "cards-1"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      SPRING_PROFILES_ACTIVE: default
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      #OTEL_SERVICE_NAME: "cards-1"
      #OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-lgtm-ms:4318"
      #OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
    networks:
      - jaganMs

  gatewayserver:
    image: "jagan619/gatewayserver:v1"
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    depends_on:
      accounts:
        condition: service_healthy
      cards:
        condition: service_healthy
      loans:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "gatewayserver-1"
      SPRING_DATA_REDIS_CONNECT-TIMEOUT: 2s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      SPRING_PROFILES_ACTIVE: default
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      #OTEL_SERVICE_NAME: "gatewayserver-1"
      #OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-lgtm-ms:4318"
      #OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
    networks:
      - jaganMs

networks:
  jaganMs:
    driver: bridge

volumes:
  grafana-lgtm-data: