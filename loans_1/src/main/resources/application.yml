#Actuator - refresh, busrefresh
management: 
  endpoints: 
    web:
      exposure: 
        include: "*"
  health:  
    readiness-state: 
      enabled: true
    liveness-state: 
      enabled: true
      
  endpoint: 
    shutdown: 
      enabled: true
    health: 
      probes: 
        enabled: true		
  info: 
    env: 
      enabled: true        

#endpoints:
  #shutdown:
    #enabled: true

  #Observability
  #traces and logs travel through opentelemetry sdk
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name} #defines service specific data
      deployment.environment: "development"     #prod/QA/
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0  #Sampling decides what fraction of requests get to traced.
      #In production, you would never trace 100%. So the default is only 10%
      #this probability to 1.0, which tells libraries to trace everything.
      # I want 100% of my request to get traced.[for local learning purpose]
  #Metrices
  # metrics are shipped through micrometer own OTLP registry.
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s        # push the metrics every 10 seconds
  metrics:     #we are tagging every metric with the application name
    tags:
      application: ${spring.application.name}
      

eureka: 
  instance: 
    preferIpAddress: true #register with ip address instead of dns
  client: 
    fetchRegistry: true                  
    registerWithEureka: true
    serviceUrl: 
      defaultZone: http://localhost:8070/eureka/

info: 
  app: 
    name: "loans-1"
    description: "Jagan Microservice loans_1 App"
    version: "1.0.0"


