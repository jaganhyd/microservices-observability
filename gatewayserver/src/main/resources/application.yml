spring:  
  application: 
    name: "gatewayserver-1"

  config:                                   # this should comment when use docker compose
    import: "configserver:http://localhost:8071/"
 
  #asking SD(eureka) to locate all individual MSs
  cloud: 
    gateway: 
      discovery: 
        locator: 
          enabled: true
          lowerCaseServiceId: true
      httpclient: 
        connect-timeout: 1000
        response-timeout: 2s
  
  data: 
    redis: 
      connect-timeout: 2s
      host: localhost
      port: 6379
      temeout: 1s
  
  
#Actuator for refresh config props from git
management: 
  endpoints: 
    web: 
      exposure: 
        include: "*"
  endpoint: 
    gateway: 
      enabled: true
  info: 
    env: 
      enabled: true
    
info: 
  app: 
    name: "gatewayserver"
    description: "Jagan Microservice gatewayserver App"
    version: "1.0.0"
    
logging: 
  level: 
    com: 
      example: 
        gatewayserver: DEBUG
        
resilience4j.circuitbreaker: 
  configs: 
    default: 
      slidingWindowSize: 10                             #monitor 10 req before change status colse -> open
      permittedNumberOfCallsInHalfOpenState: 2          #Allow 2 reqs in half Ope
      failureRateThreshold: 50                          #if at least 50% of my requests are failed, circuit breaker pattern can move to the open state from the closed state.
      waitDurationInOpenState: 10000                    #Time duration it will remain in open state before it goes to half open
      


