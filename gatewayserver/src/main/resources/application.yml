server:
  port: 8072

spring:
  application: 
    name: "gatewayserver"
  reactor:
    context-propagation: auto

  config:                                   # this should comment when use docker compose
    import: "configserver:http://localhost:8071/"
 
  #asking SD(eureka) to locate all individual MSs
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s
  
  data: 
    redis: 
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s
#Actuator for refresh config props from git
management:
  endpoints: 
    web: 
      exposure: 
        include: "*"
  endpoint: 
    gateway: 
      enabled: true
  info: 
    env: 
      enabled: true

  #Observability
  #traces and logs travel through opentelemetry sdk
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name} #defines service specific data
      deployment.environment: "development"     #prod/QA/
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0  #Sampling decides what fraction of requests get to traced.
      #In production, you would never trace 100%. So the default is only 10%
      #this probability to 1.0, which tells libraries to trace everything.
      # I want 100% of my request to get traced.[for local learning purpose]
  #Metrices
  # metrics are shipped through micrometer own OTLP registry.
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s        # push the metrics every 10 seconds
  metrics:     #we are tagging every metric with the application name
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    preferIpAddress: true #register with ip address instead of dns
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "gatewayserver"
    description: "Jagan Microservice gatewayserver App"
    version: "1.0.0"

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) %magenta([traceId=%X{traceId:-},spanId=%X{spanId:-}]) - %cyan(%msg%n)}
  level:
    com:
      example:
        gatewayserver: DEBUG
        
resilience4j.circuitbreaker: 
  configs: 
    default: 
      slidingWindowSize: 10                             #monitor 10 req before change status colse -> open
      permittedNumberOfCallsInHalfOpenState: 2          #Allow 2 reqs in half Ope
      failureRateThreshold: 50                          #if at least 50% of my requests are failed, circuit breaker pattern can move to the open state from the closed state.
      waitDurationInOpenState: 10000                    #Time duration it will remain in open state before it goes to half open
      

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10                             #monitor 10 req before change status close -> open
        permittedNumberOfCallsInHalfOpenState: 2          #Allow 2 reqs in half Open
        failureRateThreshold: 50                          #if at least 50% of my requests are failed, circuit breaker pattern can move to the open state from the closed state.
        waitDurationInOpenState: 10000
