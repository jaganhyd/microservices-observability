server.port=8080
spring.application.name=accounts-1
spring.active=prod

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true

spring.cloud.openfeign.circuitbreaker.enabled=true

management.endpoints.web.exposure.include=*
management.endpoints.health.readiness-state.enabled=true
management.endpoints.health.liveness-state.enabled=true
management.endpoints.shutdown.enabled=true
management.endpoint.shutdown.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.info.env.enabled=true

management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.deployment.environment=development
management.logging.export.otlp.endpoint=http://localhost:4318/v1/logs

management.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0

management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.step=10s

eureka.instance.preferIpAddress=true
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:8070/eureka/

info.app.name=accounts-1
info.app.description=Jagan Microservice accounts_1 App
info.app.version=1.0.0
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) %magenta([traceId=%X{traceId:-},spanId=%X{spanId:-}]) - %cyan(%msg%n)}
://level.com.eazybytes.accounts=DEBUG

resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000
resilience4j.retry.configs.default.maximumRetryAttempts=3
resilience4j.retry.configs.default.waitDuration=500
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2
resilience4j.retry.configs.default.ignoreExceptions[0]=java.lang.NullPointerException
resilience4j.retry.configs.default.retryExceptions[0]=java.util.concurrent.TimeoutException
resilience4j.ratelimiter.configs.default.timeoutDuration=1000
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=5000
resilience4j.ratelimiter.configs.default.limitForPeriod=1